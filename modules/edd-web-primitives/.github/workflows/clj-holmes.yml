# .github/workflows/clj-holmes.yml
name: clj-holmes SAST Scan

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  clj-holmes-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clj-holmes
        run: |
          curl -sSL https://github.com/clj-holmes/clj-holmes/releases/latest/download/clj-holmes-linux-amd64 -o clj-holmes
          chmod +x clj-holmes
          sudo mv clj-holmes /usr/local/bin/

      - name: Run clj-holmes SAST scan
        run: |
          clj-holmes scan . --output sarif > clj-holmes-results.sarif

      - name: Upload clj-holmes SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clj-holmes-results.sarif

